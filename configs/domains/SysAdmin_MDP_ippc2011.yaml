# Hyperparamètres PPO pour SysAdmin (IPPC 2011)
algo_kwargs:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.0
  clip_range: 0.2

total_timesteps: 1000000
eval_episodes: 300

# Early stopping
early_stop_window: 200
early_stop_patience: 20
early_stop_min_delta: 0.01
early_stop_check_freq: 200
early_stop_min_timesteps: 100000

# Paramètres CP (utilisés uniquement si algo=ppo-cp)
cp:
  port: 12348
  bp_iter: 3
  alpha: 1.0
  java_project_dir: "MiniCPBP"
