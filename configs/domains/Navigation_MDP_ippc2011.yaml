# Hyperparamètres PPO/PPO-CP pour Navigation (IPPC 2011)
ppo:
  algo_kwargs:
    learning_rate: 3.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    ent_coef: 0.01
    clip_range: 0.2

ppo-cp:
  algo_kwargs:
    learning_rate: 3.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    ent_coef: 0.01
    clip_range: 0.2

total_timesteps: 1000000
eval_episodes: 300

# Early stopping
early_stop_enabled: false
early_stop_window: 200
early_stop_patience: 100
early_stop_min_delta: 0.01
early_stop_check_freq: 200
early_stop_min_timesteps: 100000

# Paramètres CP (utilisés uniquement si algo=ppo-cp)
cp:
  port: 12350
  bp_iter: 1
  alpha: 40.0
  java_project_dir: "MiniCPBP"
